[package]
name = "hunex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The hunex command: inspect, round-trip and assemble HuneX engine files"
keywords = ["hunex", "chs", "hfa", "lenzu"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
name = "hunex_cli"
path = "src/lib.rs"

[[bin]]
name = "hunex"
path = "src/main.rs"

[dependencies]
hunex-chs = { path = "../hunex-chs", version = "0.1.0" }
hunex-hfa = { path = "../hunex-hfa", version = "0.1.0" }
hunex-lenzu = { path = "../hunex-lenzu", version = "0.1.0" }
hunex-ctd = { path = "../hunex-ctd", version = "0.1.0" }
hunex-ccit = { path = "../hunex-ccit", version = "0.1.0" }
hunex-cbg = { path = "../hunex-cbg", version = "0.1.0" }
hunex-hw = { path = "../hunex-hw", version = "0.1.0" }
hunex-nopus = { path = "../hunex-nopus", version = "0.1.0" }
hunex-ogg = { path = "../hunex-ogg", version = "0.1.0" }
hunex-image = { path = "../hunex-image", version = "0.1.0" }
hunex-mzp = { path = "../hunex-mzp", version = "0.1.0" }
hunex-mzx = { path = "../hunex-mzx", version = "0.1.0" }
hunex-mrg = { path = "../hunex-mrg", version = "0.1.0" }
hunex-nx = { path = "../hunex-nx", version = "0.1.0" }
hunex-switch-text = { path = "../hunex-switch-text", version = "0.1.0" }
png = "0.18"
