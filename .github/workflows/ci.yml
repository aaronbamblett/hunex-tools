name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm (unknown)
        run: cargo build -p hunex-chs --target wasm32-unknown-unknown
      - name: wasm (wasip2)
        run: cargo build -p hunex-chs --target wasm32-wasip2
      - name: wasm libraries (unknown)
        run: cargo build -p hunex-lenzu -p hunex-hfa --target wasm32-unknown-unknown
      - name: wasm libraries (wasip2)
        run: cargo build -p hunex-lenzu -p hunex-hfa --target wasm32-wasip2
      - name: wasm ctd (unknown)
        run: cargo build -p hunex-ctd --target wasm32-unknown-unknown
      - name: wasm ctd (wasip2)
        run: cargo build -p hunex-ctd --target wasm32-wasip2
      - name: wasm ogg, hw, nopus (unknown)
        run: cargo build -p hunex-ogg -p hunex-hw -p hunex-nopus --target wasm32-unknown-unknown
      - name: wasm ogg, hw, nopus (wasip2)
        run: cargo build -p hunex-ogg -p hunex-hw -p hunex-nopus --target wasm32-wasip2
      - name: wasm mzx, mzp, image (unknown)
        run: cargo build -p hunex-mzx -p hunex-mzp -p hunex-image --target wasm32-unknown-unknown
      - name: wasm mzx, mzp, image (wasip2)
        run: cargo build -p hunex-mzx -p hunex-mzp -p hunex-image --target wasm32-wasip2
      - name: wasm mrg, nx, switch-text (unknown)
        run: cargo build -p hunex-mrg -p hunex-nx -p hunex-switch-text --target wasm32-unknown-unknown
      - name: wasm mrg, nx, switch-text (wasip2)
        run: cargo build -p hunex-mrg -p hunex-nx -p hunex-switch-text --target wasm32-wasip2
      - name: wasm ccit (unknown)
        run: cargo build -p hunex-ccit --target wasm32-unknown-unknown
      - name: wasm ccit (wasip2)
        run: cargo build -p hunex-ccit --target wasm32-wasip2
